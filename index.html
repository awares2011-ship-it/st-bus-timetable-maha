<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b91c1c" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary SEO tags (per-page values are set at runtime + prerendered) -->
    <title>ST Bus Timetable Maha – MSRTC Bus Timings | एसटी बस वेळापत्रक महा</title>
    <meta
      name="description"
      content="Search Maharashtra ST (MSRTC) bus timetables and timings between cities. Fast, offline-capable, and multilingual (English, Marathi, Hindi). Independent information service."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ST Bus Timetable Maha – MSRTC Bus Timings" />
    <meta
      property="og:description"
      content="Search MSRTC ST bus timings between cities. Offline-first, multilingual, free."
    />
    <meta property="og:locale" content="mr_IN" />
    <meta property="og:locale:alternate" content="en_IN" />
    <meta property="og:locale:alternate" content="hi_IN" />

    <!-- Devanagari-capable webfont (progressive enhancement; system fonts used offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <meta name="msrtc-disclaimer" content="Independent service. Not affiliated with MSRTC." />
  </head>
  <body>
    <!-- No-JS fallback (sibling of #root so prerender can fill #root cleanly) -->
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 24px; max-width: 640px; margin: 0 auto;">
        <h1>ST Bus Timetable Maha</h1>
        <p>
          This app needs JavaScript to search bus timings. It is an independent
          public-transport information service and is not affiliated with MSRTC.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
