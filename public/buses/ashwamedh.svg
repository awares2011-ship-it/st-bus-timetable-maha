<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140">
  <!-- Real Ashwamedh Scania: deep orange body, horse silhouette, अश्वमेध in Devanagari -->
  <ellipse cx="162" cy="134" rx="132" ry="5" fill="#00000020"/>
  <!-- Main deep orange body -->
  <path d="M14 26 Q18 12 38 10 L282 10 Q304 10 306 24 L306 112 Q306 118 298 118 L24 118 Q14 118 14 112Z" fill="#ea580c"/>
  <!-- Darker orange top section (gradient effect) -->
  <path d="M14 26 Q18 12 38 10 L282 10 Q304 10 306 24 L306 46 L14 46Z" fill="#c2410c"/>
  <!-- Dark grey/charcoal roof -->
  <rect x="18" y="10" width="282" height="16" rx="3" fill="#1c1917"/>
  <!-- Marathi header on roof (white) -->
  <text x="154" y="21" font-family="'Noto Sans Devanagari',Arial,sans-serif" font-size="7" font-weight="bold" fill="white" text-anchor="middle">महाराष्ट्र राज्य मार्ग परिवहन महामंडळ</text>

  <!-- Sun circle (golden, background to horse) -->
  <circle cx="128" cy="76" rx="36" ry="36" r="36" fill="#fbbf24" opacity="0.18"/>
  <circle cx="128" cy="80" r="28" fill="#f59e0b" opacity="0.22"/>

  <!-- Galloping horse silhouette (stylised, in darker orange/brown) -->
  <!-- Horse body -->
  <ellipse cx="130" cy="74" rx="38" ry="20" fill="#9a3412" opacity="0.85" transform="rotate(-8 130 74)"/>
  <!-- Horse head -->
  <ellipse cx="166" cy="58" rx="14" ry="11" fill="#9a3412" opacity="0.85" transform="rotate(-20 166 58)"/>
  <!-- Horse neck -->
  <path d="M152 66 Q160 52 172 50 Q177 55 174 63 Q165 67 152 70Z" fill="#9a3412" opacity="0.85"/>
  <!-- Mane -->
  <path d="M164 52 Q168 44 172 48 Q166 50 162 56Z" fill="#7c2d12" opacity="0.9"/>
  <!-- Tail -->
  <path d="M94 68 Q76 58 70 46 Q78 52 88 62 Q98 72 98 80Z" fill="#9a3412" opacity="0.85"/>
  <!-- Legs (galloping — front two raised, back two extended) -->
  <path d="M154 90 Q158 104 152 116" stroke="#9a3412" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M138 92 Q140 108 136 118" stroke="#9a3412" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M122 88 Q126 100 130 112" stroke="#9a3412" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M108 82 Q110 94 118 104" stroke="#9a3412" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Eye -->
  <circle cx="170" cy="56" r="2" fill="#1c1917" opacity="0.9"/>

  <!-- अश्वमेध large Devanagari brand name -->
  <text x="196" y="72" font-family="'Noto Sans Devanagari',Arial,sans-serif" font-size="26" font-weight="bold" fill="#fef3c7" text-anchor="middle" opacity="0.97">अश्वमेध</text>

  <!-- MSRTC emblem -->
  <circle cx="250" cy="78" r="12" fill="#fbbf24" stroke="#ea580c" stroke-width="1.5" opacity="0.9"/>
  <circle cx="250" cy="78" r="9"  fill="#1e3a8a" opacity="0.9"/>
  <text x="250" y="82" font-family="Arial,sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">ST</text>

  <!-- Windows: large tinted, slightly amber tint (through orange body = amber look) -->
  <rect x="22"  y="28" width="44" height="34" rx="3" fill="#374151" opacity="0.8"/>
  <rect x="72"  y="28" width="44" height="34" rx="3" fill="#374151" opacity="0.8"/>
  <rect x="122" y="28" width="44" height="34" rx="3" fill="#374151" opacity="0.8"/>
  <rect x="172" y="28" width="44" height="34" rx="3" fill="#374151" opacity="0.8"/>
  <rect x="222" y="28" width="36" height="34" rx="3" fill="#374151" opacity="0.8"/>

  <!-- Subtle window glare -->
  <rect x="24"  y="29" width="16" height="5" rx="1" fill="white" opacity="0.12"/>
  <rect x="74"  y="29" width="16" height="5" rx="1" fill="white" opacity="0.12"/>
  <rect x="124" y="29" width="16" height="5" rx="1" fill="white" opacity="0.12"/>
  <rect x="174" y="29" width="16" height="5" rx="1" fill="white" opacity="0.12"/>
  <rect x="224" y="29" width="14" height="5" rx="1" fill="white" opacity="0.12"/>

  <!-- Lower decorative band (darker orange stripe) -->
  <rect x="14" y="94" width="292" height="4" fill="#c2410c"/>

  <!-- Front face (Scania style — aerodynamic, dark) -->
  <rect x="264" y="10" width="42" height="108" rx="6" fill="#f97316"/>
  <!-- Windscreen (Scania — large, slanted) -->
  <path d="M266 18 L304 18 L304 72 Q304 76 300 76 L266 76Z" fill="#1f2937" opacity="0.88"/>
  <rect x="268" y="20" width="16" height="10" rx="2" fill="white" opacity="0.1"/>
  <line x1="268" y1="74" x2="302" y2="46" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
  <!-- SCANIA badging -->
  <text x="284" y="84" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#fef3c7" text-anchor="middle">SCANIA</text>
  <!-- Front grille (Scania large grill) -->
  <rect x="267" y="92" width="36" height="16" rx="3" fill="#1c1917"/>
  <rect x="269" y="94" width="32" height="12" rx="2" fill="#111827"/>
  <!-- Grill bars -->
  <line x1="269" y1="97" x2="301" y2="97" stroke="#374151" stroke-width="1"/>
  <line x1="269" y1="100" x2="301" y2="100" stroke="#374151" stroke-width="1"/>
  <line x1="269" y1="103" x2="301" y2="103" stroke="#374151" stroke-width="1"/>
  <!-- Headlights -->
  <rect x="268" y="78" width="14" height="8" rx="2" fill="#fef08a" opacity="0.9"/>
  <rect x="290" y="78" width="12" height="8" rx="2" fill="#fef08a" opacity="0.9"/>
  <!-- Number plate -->
  <rect x="269" y="109" width="34" height="8" rx="1" fill="#fef08a" stroke="#374151" stroke-width="0.5"/>
  <text x="286" y="115" font-family="Arial,sans-serif" font-size="5" font-weight="bold" fill="#1f2937" text-anchor="middle">MH 06 S 9787</text>

  <!-- Wheels (Scania — larger, multi-axle) -->
  <circle cx="68"  cy="122" r="17" fill="#111827"/>
  <circle cx="68"  cy="122" r="11" fill="#374151"/>
  <circle cx="68"  cy="122" r="5"  fill="#6b7280"/>
  <circle cx="68"  cy="122" r="2"  fill="#9ca3af"/>
  <circle cx="232" cy="122" r="17" fill="#111827"/>
  <circle cx="232" cy="122" r="11" fill="#374151"/>
  <circle cx="232" cy="122" r="5"  fill="#6b7280"/>
  <circle cx="232" cy="122" r="2"  fill="#9ca3af"/>
  <!-- Extra rear axle (Scania feature) -->
  <circle cx="256" cy="122" r="14" fill="#111827"/>
  <circle cx="256" cy="122" r="9"  fill="#374151"/>
  <circle cx="256" cy="122" r="4"  fill="#6b7280"/>
  <!-- Wheel arches -->
  <path d="M44 114 Q68 104 92 114"   fill="#ea580c" stroke="#c2410c" stroke-width="0.5"/>
  <path d="M208 114 Q232 104 258 114" fill="#ea580c" stroke="#c2410c" stroke-width="0.5"/>
  <!-- Side mirror (orange) -->
  <rect x="306" y="24" width="12" height="9" rx="3" fill="#9a3412" stroke="#7c2d12" stroke-width="0.5"/>
  <line x1="311" y1="33" x2="311" y2="38" stroke="#7c2d12" stroke-width="1.5"/>
  <!-- Destination board front (Swargate → Dadar) -->
  <rect x="266" y="10" width="38" height="8" rx="2" fill="#0d1117"/>
  <text x="285" y="16" font-family="'Noto Sans Devanagari',Arial,sans-serif" font-size="5" fill="#fbbf24" text-anchor="middle">स्वारगेट → दादर</text>
</svg>
