<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140">
  <!-- Real MSRTC new bus: white upper, bold red band + stripe, MSRTC logo, black roof -->
  <ellipse cx="160" cy="134" rx="128" ry="5" fill="#00000018"/>
  <!-- White body -->
  <path d="M16 30 Q20 16 38 14 L284 14 Q302 14 304 28 L304 112 Q304 116 298 116 L22 116 Q16 116 16 112Z" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
  <!-- Black roof (bold, modern) -->
  <rect x="20" y="14" width="280" height="22" rx="3" fill="#0d1117"/>
  <!-- Yellow header text -->
  <text x="148" y="27" font-family="'Noto Sans Devanagari',Arial,sans-serif" font-size="8" font-weight="bold" fill="#fbbf24" text-anchor="middle">महाराष्ट्र राज्य मार्ग परिवहन महामंडळ</text>
  <!-- Bold red upper stripe (characteristic of this bus) -->
  <rect x="16" y="36" width="288" height="12" fill="#dc2626"/>
  <!-- Thin gold line below red stripe -->
  <rect x="16" y="48" width="288" height="2.5" fill="#fbbf24"/>
  <!-- Windows -->
  <rect x="24"  y="52" width="40" height="30" rx="3" fill="#1e3a8a" opacity="0.78"/>
  <rect x="70"  y="52" width="40" height="30" rx="3" fill="#1e3a8a" opacity="0.78"/>
  <rect x="116" y="52" width="40" height="30" rx="3" fill="#1e3a8a" opacity="0.78"/>
  <rect x="162" y="52" width="40" height="30" rx="3" fill="#1e3a8a" opacity="0.78"/>
  <rect x="208" y="52" width="40" height="30" rx="3" fill="#1e3a8a" opacity="0.78"/>
  <rect x="252" y="52" width="14" height="30" rx="2" fill="#1e3a8a" opacity="0.78"/>
  <!-- Window glare -->
  <rect x="24"  y="53" width="15" height="5" rx="1" fill="white" opacity="0.22"/>
  <rect x="70"  y="53" width="15" height="5" rx="1" fill="white" opacity="0.22"/>
  <rect x="116" y="53" width="15" height="5" rx="1" fill="white" opacity="0.22"/>
  <rect x="162" y="53" width="15" height="5" rx="1" fill="white" opacity="0.22"/>
  <rect x="208" y="53" width="15" height="5" rx="1" fill="white" opacity="0.22"/>
  <!-- MSRTC emblem (circular, with lion) -->
  <circle cx="156" cy="68" r="13" fill="white" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="156" cy="68" r="10" fill="#1e3a8a"/>
  <text x="156" y="64" font-family="Arial,sans-serif" font-size="5" font-weight="bold" fill="#fbbf24" text-anchor="middle">MSRTC</text>
  <text x="156" y="72" font-family="'Noto Sans Devanagari',Arial,sans-serif" font-size="4.5" fill="white" text-anchor="middle">महामंडळ</text>
  <!-- Gold divider line -->
  <rect x="16" y="84" width="288" height="3" fill="#fbbf24"/>
  <!-- Red lower skirt -->
  <path d="M16 87 L304 87 L304 112 Q298 116 290 116 L22 116 Q16 116 16 112Z" fill="#dc2626"/>
  <!-- Luggage hatches in skirt -->
  <rect x="22"  y="91" width="46" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <rect x="74"  y="91" width="46" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <rect x="126" y="91" width="46" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <rect x="178" y="91" width="46" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <rect x="230" y="91" width="38" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <!-- Front face -->
  <rect x="268" y="14" width="36" height="102" rx="4" fill="#f1f5f9"/>
  <!-- Windscreen dark tint -->
  <rect x="270" y="24" width="32" height="46" rx="3" fill="#1e3a8a" opacity="0.8"/>
  <rect x="272" y="25" width="13" height="9" rx="2" fill="white" opacity="0.14"/>
  <line x1="272" y1="70" x2="300" y2="50" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Door -->
  <rect x="254" y="46" width="14" height="44" rx="1" fill="#e2e8f0" stroke="#9ca3af" stroke-width="0.5"/>
  <line x1="261" y1="46" x2="261" y2="90" stroke="#cbd5e1" stroke-width="0.8"/>
  <!-- Front grille (dark) -->
  <rect x="270" y="94" width="32" height="12" rx="2" fill="#1f2937"/>
  <!-- Headlights (round, classic) -->
  <circle cx="278" cy="100" r="4.5" fill="white" stroke="#9ca3af" stroke-width="0.6"/>
  <circle cx="292" cy="100" r="4.5" fill="white" stroke="#9ca3af" stroke-width="0.6"/>
  <circle cx="278" cy="100" r="2.8" fill="#fef9c3"/>
  <circle cx="292" cy="100" r="2.8" fill="#fef9c3"/>
  <!-- Fog light amber -->
  <rect x="272" y="106" width="7" height="3" rx="1" fill="#fbbf24"/>
  <!-- Number plate -->
  <rect x="271" y="109" width="30" height="7" rx="1" fill="#fef08a" stroke="#374151" stroke-width="0.5"/>
  <text x="286" y="114" font-family="Arial,sans-serif" font-size="4.5" font-weight="bold" fill="#1f2937" text-anchor="middle">MH XX XX XXXX</text>
  <!-- Wheels -->
  <circle cx="66"  cy="122" r="16" fill="#111827"/>
  <circle cx="66"  cy="122" r="10" fill="#374151"/>
  <circle cx="66"  cy="122" r="5"  fill="#6b7280"/>
  <circle cx="66"  cy="122" r="2"  fill="#9ca3af"/>
  <circle cx="248" cy="122" r="16" fill="#111827"/>
  <circle cx="248" cy="122" r="10" fill="#374151"/>
  <circle cx="248" cy="122" r="5"  fill="#6b7280"/>
  <circle cx="248" cy="122" r="2"  fill="#9ca3af"/>
  <path d="M43 114 Q66 104 89 114"   fill="white" stroke="#e5e7eb" stroke-width="0.5"/>
  <path d="M225 114 Q248 104 271 114" fill="white" stroke="#e5e7eb" stroke-width="0.5"/>
  <!-- Mirror -->
  <rect x="304" y="30" width="11" height="7" rx="2" fill="#4b5563" stroke="#374151" stroke-width="0.5"/>
  <line x1="309" y1="37" x2="309" y2="42" stroke="#4b5563" stroke-width="1.5"/>
</svg>
