<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140">
  <!-- Real MSRTC ordinary bus: white upper body, red lower skirt, black roof band, yellow destination text -->
  <ellipse cx="160" cy="134" rx="128" ry="5" fill="#00000018"/>
  <!-- White main body -->
  <path d="M16 32 Q20 18 38 16 L284 16 Q302 16 304 30 L304 110 Q304 114 298 114 L22 114 Q16 114 16 110Z" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
  <!-- Black roof band -->
  <rect x="20" y="16" width="280" height="20" rx="3" fill="#111827"/>
  <!-- Yellow Marathi text on roof -->
  <text x="148" y="29" font-family="'Noto Sans Devanagari',Arial,sans-serif" font-size="8" font-weight="bold" fill="#fbbf24" text-anchor="middle">महाराष्ट्र राज्य मार्ग परिवहन महामंडळ</text>
  <!-- Thin red stripe below roof -->
  <rect x="16" y="36" width="288" height="8" fill="#dc2626"/>
  <!-- Windows - dark blue tinted -->
  <rect x="24"  y="46" width="38" height="30" rx="3" fill="#1e3a8a" opacity="0.75"/>
  <rect x="68"  y="46" width="38" height="30" rx="3" fill="#1e3a8a" opacity="0.75"/>
  <rect x="112" y="46" width="38" height="30" rx="3" fill="#1e3a8a" opacity="0.75"/>
  <rect x="156" y="46" width="38" height="30" rx="3" fill="#1e3a8a" opacity="0.75"/>
  <rect x="200" y="46" width="38" height="30" rx="3" fill="#1e3a8a" opacity="0.75"/>
  <rect x="244" y="46" width="16" height="30" rx="2" fill="#1e3a8a" opacity="0.75"/>
  <!-- Window glare -->
  <rect x="24"  y="47" width="14" height="5" rx="1" fill="white" opacity="0.22"/>
  <rect x="68"  y="47" width="14" height="5" rx="1" fill="white" opacity="0.22"/>
  <rect x="112" y="47" width="14" height="5" rx="1" fill="white" opacity="0.22"/>
  <rect x="156" y="47" width="14" height="5" rx="1" fill="white" opacity="0.22"/>
  <rect x="200" y="47" width="14" height="5" rx="1" fill="white" opacity="0.22"/>
  <!-- "सुस्वागतम" on upper white panel -->
  <text x="148" y="41" font-family="'Noto Sans Devanagari',Arial,sans-serif" font-size="6" fill="#dc2626" text-anchor="middle" font-weight="bold" opacity="0.9">सुस्वागतम</text>
  <!-- Gold / yellow divider stripe -->
  <rect x="16" y="80" width="288" height="3" fill="#fbbf24"/>
  <!-- Red lower skirt -->
  <path d="M16 83 L304 83 L304 110 Q298 114 290 114 L22 114 Q16 114 16 110Z" fill="#dc2626"/>
  <!-- MSRTC emblem on white area -->
  <circle cx="156" cy="64" r="10" fill="white" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="156" cy="64" r="7" fill="#1e3a8a"/>
  <text x="156" y="67" font-family="Arial,sans-serif" font-size="5.5" font-weight="bold" fill="white" text-anchor="middle">ST</text>
  <!-- Luggage hatches -->
  <rect x="22"  y="87" width="44" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <rect x="72"  y="87" width="44" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <rect x="122" y="87" width="44" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <rect x="172" y="87" width="44" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <rect x="222" y="87" width="40" height="16" rx="2" fill="#b91c1c" stroke="#991b1b" stroke-width="0.5"/>
  <!-- Front face -->
  <rect x="268" y="16" width="36" height="98" rx="4" fill="#f8fafc"/>
  <!-- Windscreen -->
  <rect x="270" y="26" width="32" height="44" rx="3" fill="#93c5fd" opacity="0.72"/>
  <line x1="272" y1="70" x2="300" y2="46" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Door -->
  <rect x="254" y="42" width="14" height="46" rx="1" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5"/>
  <line x1="261" y1="42" x2="261" y2="88" stroke="#9ca3af" stroke-width="0.8"/>
  <!-- Front bumper red -->
  <rect x="270" y="92" width="32" height="14" rx="3" fill="#dc2626"/>
  <!-- Headlights -->
  <circle cx="279" cy="99" r="5" fill="white" stroke="#9ca3af" stroke-width="0.6"/>
  <circle cx="293" cy="99" r="5" fill="white" stroke="#9ca3af" stroke-width="0.6"/>
  <circle cx="279" cy="99" r="3" fill="#fef9c3"/>
  <circle cx="293" cy="99" r="3" fill="#fef9c3"/>
  <!-- Number plate -->
  <rect x="271" y="107" width="30" height="7" rx="1" fill="#fef08a" stroke="#374151" stroke-width="0.5"/>
  <text x="286" y="112" font-family="Arial,sans-serif" font-size="4.5" font-weight="bold" fill="#1f2937" text-anchor="middle">MH 14 BT 0358</text>
  <!-- Wheels -->
  <circle cx="66"  cy="120" r="17" fill="#111827"/>
  <circle cx="66"  cy="120" r="11" fill="#374151"/>
  <circle cx="66"  cy="120" r="5"  fill="#6b7280"/>
  <circle cx="66"  cy="120" r="2"  fill="#9ca3af"/>
  <circle cx="248" cy="120" r="17" fill="#111827"/>
  <circle cx="248" cy="120" r="11" fill="#374151"/>
  <circle cx="248" cy="120" r="5"  fill="#6b7280"/>
  <circle cx="248" cy="120" r="2"  fill="#9ca3af"/>
  <!-- Wheel arches -->
  <path d="M42 112 Q66 102 90 112"   fill="white" stroke="#e5e7eb" stroke-width="0.5"/>
  <path d="M224 112 Q248 102 272 112" fill="white" stroke="#e5e7eb" stroke-width="0.5"/>
  <!-- Side mirror -->
  <rect x="304" y="32" width="11" height="7" rx="2" fill="#4b5563" stroke="#374151" stroke-width="0.5"/>
  <line x1="309" y1="39" x2="309" y2="44" stroke="#4b5563" stroke-width="1.5"/>
</svg>
